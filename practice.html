<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Return Mechanism</title>
    <style>
        body {
            text-align: center;
        }
        svg {
            border: 1px solid black;
        }
        .link {
            stroke: black;
            stroke-width: 3;
        }
        .joint {
            fill: red;
        }
        .label {
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h2>Quick Return Mechanism</h2>
    <svg width="500" height="400" viewBox="0 0 500 400">
        <!-- Fixed Base -->
        <line x1="50" y1="300" x2="450" y2="300" stroke="black" stroke-width="5" />
        
        <!-- Crank (Driving Link) -->
        <line x1="150" y1="300" x2="200" y2="200" class="link" />
        
        <!-- Slotted Link -->
        <line x1="200" y1="200" x2="300" y2="200" class="link" />
        
        <!-- Ram (Reciprocating Output) -->
        <line x1="300" y1="200" x2="350" y2="300" class="link" />
        
        <!-- Joints -->
        <circle cx="150" cy="300" r="5" class="joint" />  <!-- Fixed Pivot -->
        <circle cx="200" cy="200" r="5" class="joint" />  <!-- Crank to Slotted Link -->
        <circle cx="300" cy="200" r="5" class="joint" />  <!-- Slotted Link to Ram -->
        <circle cx="350" cy="300" r="5" class="joint" />  <!-- Ram End -->
        
        <!-- Labels -->
        <text x="140" y="315" class="label">O</text>
        <text x="190" y="190" class="label">A</text>
        <text x="290" y="190" class="label">B</text>
        <text x="340" y="315" class="label">C</text>
    </svg>
</body>
</html>
